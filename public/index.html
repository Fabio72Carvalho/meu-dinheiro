<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dinheiro - Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/app-layout.css">
</head>

<body>

    <section id="view-login">
        <div class="login-container">

            <div class="logo-area">
                <div class="logo-placeholder">
                    <img src="favicon.ico" alt="Logo Meu Dinheiro" class="logo-img">
                </div>
                <h1 id="form-title">Meu Dinheiro</h1>
                <p id="form-subtitle" class="subtitle">Acesse sua conta para continuar</p>
            </div>

            <form id="auth-form" data-mode="login">

                <div class="form-group" id="name-field">
                    <label for="nome">Informe o nome</label>
                    <input type="text" id="nome" placeholder="Como quer ser chamado?">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="button-group-login">
                    <button type="submit" class="btn-login" id="main-btn">
                        <span class="btn-text">Entrar</span>
                        <div class="spinner"></div>
                    </button>
                    <button type="button" class="btn-register" id="switch-btn">Cadastrar-me</button>
                </div>

            </form>

            <p id="mensagem"></p>

        </div>
    </section>

    <!-- SECTION: Main App -->
    <section id="view-main" class="app-container" style="display: none;">

        <header class="top-nav">
            <div class="nav-left">
                <div class="brand-container">
                    <img src="favicon.ico" alt="Logo Meu Dinheiro" class="nav-logo-img">
                    <h2 class="app-logo">Meu Dinheiro</h2>
                </div>

                <nav class="main-menu">
                    <button class="nav-item active">Transações</button>
                    <button class="nav-item">Análise</button>
                </nav>
            </div>
            <div class="nav-right">
                <span id="user-display-name">Carregando...</span>
                <button id="btn-sair" class="btn-sair-text">Sair</button>
            </div>
        </header>

        <div class="month-selector-bar">
            <div class="month-controls">
                <button id="btn-prev-month" class="btn-icon">&lt;</button>
                <h3 id="current-month-display">mes corrente</h3>
                <button id="btn-next-month" class="btn-icon">&gt;</button>
            </div>
            <button id="btn-nova-transacao" class="btn-primary">+ Nova Transação</button>
        </div>

        <div class="main-content">

            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="section-header">
                        <h4>Contas</h4>
                        <button id="btn-nova-conta" class="btn-icon-small" title="Nova Conta">+</button>
                    </div>
                    <ul id="lista-contas" class="sidebar-list">
                        <li class="empty-text">Nenhuma conta...</li>
                    </ul>
                </div>

                <div class="sidebar-section">
                    <div class="section-header">
                        <h4>Categorias</h4>
                        <button id="btn-nova-categoria" class="btn-icon-small" title="Nova Categoria">+</button>
                    </div>
                    <ul id="lista-categorias" class="sidebar-list">
                        <li class="empty-text">Nenhuma categoria...</li>
                    </ul>
                </div>
                <div class="area-testes" style="margin-top: 20px; padding: 10px; border-top: 1px solid #ccc;">
                    <button id="btn-limpar-dados"
                        style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%;">
                        🗑️ Limpar Base de Dados (Teste)
                    </button>
                </div>
            </aside>

            <main class="transactions-area">

                <div id="resumo-periodo-container" class="resumes-grid">
                    <div class="card-resumo" id="card-saldo-anterior">
                        <span class="card-titulo">Saldo Anterior</span>
                        <span class="card-valor" id="saldo-anterior">R$ 0,00</span>
                    </div>
                    <div class="card-resumo" id="card-total-periodo">
                        <span class="card-titulo" id="titulo-total-periodo">Fluxo do Mês</span>
                        <span class="card-valor" id="fluxo-mes">R$ 0,00</span>
                    </div>
                </div>

                <div class="transacoes-container">
                    <div id="transacao-hdr" class="transacao-header">
                        <span>Data</span>
                        <span>Descrição</span>
                        <span>Categoria</span>
                        <span>Conta</span>
                        <span>Valor</span>
                        <span class="coluna-saldo-diario">Saldo</span>
                    </div>

                    <div id="lista-transacoes">
                    </div>
                </div>

            </main>
        </div>
    </section>

    <!-- --- MODAL: Nova Conta --- -->
    <div id="modal-conta" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Conta</h3>
                <button id="btn-fechar-modal-conta" class="btn-close">&times;</button>
            </div>
            <form id="form-conta">
                <div class="form-group">
                    <label for="conta-nome">Nome da Conta</label>
                    <input type="text" id="conta-nome" placeholder="Ex: Nubank, Carteira" required>
                </div>
                <div class="form-group">
                    <label for="conta-saldo">Saldo Inicial</label>
                    <input type="number" id="conta-saldo" step="0.01" placeholder="0,00" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Salvar Conta</button>
            </form>
        </div>
    </div>

    <!-- --- MODAL: Nova Categoria --- -->
    <div id="modal-categoria" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Categoria</h3>
                <button id="btn-fechar-modal-categoria" class="btn-close">&times;</button>
            </div>
            <form id="form-categoria">
                <div class="form-group">
                    <label for="categoria-nome">Nome da Categoria</label>
                    <input type="text" id="categoria-nome" placeholder="Ex: Alimentação, Lazer" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Salvar
                    Categoria</button>
            </form>
        </div>
    </div>

    <!-- --- MODAL: Nova Transação --- -->
    <div id="modal-transacao" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="titulo-modal-transacao">Nova Transação</h2>
            <form id="form-transacao">
                <input type="text" id="trans-descricao" placeholder="Descrição (Ex: Supermercado)" required>
                <input type="number" id="trans-valor" placeholder="Valor (0.00)" step="0.01" required>

                <select id="trans-tipo" required>
                    <option value="despesa">Despesa</option>
                    <option value="receita">Receita</option>
                    <option value="transferencia">Transferência</option>
                </select>

                <input type="date" id="trans-data" required>

                <div id="group-categoria">
                    <label for="select-categoria">Categoria</label>
                    <select id="select-categoria" required>
                        <option value="">Selecione a Categoria</option>
                    </select>
                </div>

                <select id="select-conta" required>
                    <option value="">Selecione a Conta</option>
                </select>

                <div id="group-conta-destino" style="display: none;">
                    <label for="select-conta-destino">Conta de Destino</label>
                    <select id="select-conta-destino">
                        <option value="">Selecione a conta de destino</option>
                    </select>
                </div>

                <textarea id="trans-nota" placeholder="Observações (opcional)"></textarea>

                <button type="submit" class="main-btn">Salvar Transação</button>
                <button type="button" id="btn-excluir-transacao" class="btn btn-danger" style="display: none;">🗑️
                    Excluir</button>
            </form>
        </div>
    </div>
    <div id="alertaSistema" class="alerta oculto"></div>
    <script type="module" src="js/app.js"></script>

</body>

</html>
